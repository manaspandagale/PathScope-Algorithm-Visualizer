name: PathScope CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Verify C++, WASM, Tests, Lint, and Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Emscripten (WASM Compiler)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Install dependencies
        run: npm ci

      - name: Run native C++ unit tests
        run: node scripts/test-cpp.js

      - name: Run frontend and WASM integration tests
        run: npx vitest run

      - name: Lint codebase
        run: npm run lint

      - name: Build WebAssembly and production bundle
        run: npm run build
